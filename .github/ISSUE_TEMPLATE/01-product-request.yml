name: 需求与改进
description: 提出新功能、流程优化或使用体验建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先[搜索已有反馈](https://github.com/springmint/pos-feedback/issues?q=is%3Aissue)。Issue 公开可见，请对截图和示例数据先做脱敏。
  - type: dropdown
    id: expected-completion
    attributes:
      label: 期望完成时间
      options:
        - 不限时间
        - 1 周内
        - 2 周内
        - 1 个月内
        - 3 个月内
      default: 0
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 需求描述
      description: 说明使用场景、遇到的困难，以及希望新增或改进的功能。
      placeholder: 例如，店长交班时要逐笔核对收款，希望交班报表能按支付方式汇总实收金额。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 补充资料
      description: 可以附上脱敏截图、流程示意或相关 Issue 链接。

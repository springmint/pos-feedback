name: 问题反馈
description: 反馈功能异常、错误提示或业务流程中断
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先[搜索已有反馈](https://github.com/springmint/pos-feedback/issues?q=is%3Aissue)。Issue 公开可见，请对截图、日志和示例数据先做脱敏。
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤与问题
      description: 按顺序写出操作、实际出现的问题和错误提示。偶发问题可以补充发生频率。
      placeholder: |
        1. 打开已支付订单。
        2. 点击「打印小票」。
        3. 页面提示打印失败，打印机未出纸。约每 5 次操作发生 1 次。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 写出正常情况下应该发生什么。
      placeholder: 例如，打印机出纸，页面显示打印成功。
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 使用环境
      options:
        - Tablet
        - Handheld
        - H5
        - PC
  - type: textarea
    id: evidence
    attributes:
      label: 补充资料
      description: 可以补充版本、设备型号、发生时间，或附上脱敏截图和日志片段。
  - type: dropdown
    id: expected-completion
    attributes:
      label: 期望完成时间
      options:
        - 不限时间
        - 1 周内
        - 2 周内
        - 1 个月内
        - 3 个月内
      default: 0
    validations:
      required: true
